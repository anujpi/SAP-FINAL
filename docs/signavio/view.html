show('b', "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" id=\"Definitions_Before\" targetNamespace=\"https://frontline-shift.example/bpmn\">\n  <bpmn:collaboration id=\"Collaboration_Before\">\n    <bpmn:participant id=\"Pool\" name=\"Filling a better warehouse role today (assumed, to confirm with a customer)\" processRef=\"Process_Before\" />\n  </bpmn:collaboration>\n  <bpmn:process id=\"Process_Before\" name=\"Filling a better warehouse role today (assumed, to confirm with a customer)\" isExecutable=\"false\">\n    <bpmn:laneSet id=\"LaneSet_Before\">\n        <bpmn:lane id=\"Lane_0\" name=\"Warehouse worker\">\n          <bpmn:flowNodeRef>Start_W</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>T_Work</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>End_W</bpmn:flowNodeRef>\n        </bpmn:lane>\n        <bpmn:lane id=\"Lane_1\" name=\"Supervisor\">\n          <bpmn:flowNodeRef>T_Memory</bpmn:flowNodeRef>\n        </bpmn:lane>\n        <bpmn:lane id=\"Lane_2\" name=\"HR\">\n          <bpmn:flowNodeRef>Start_R</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>T_Ask</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>G_Known</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>T_Interview</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>End_I</bpmn:flowNodeRef>\n        </bpmn:lane>\n        <bpmn:lane id=\"Lane_3\" name=\"Recruiting agency\">\n          <bpmn:flowNodeRef>T_Agency</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>T_Hire</bpmn:flowNodeRef>\n          <bpmn:flowNodeRef>End_E</bpmn:flowNodeRef>\n        </bpmn:lane>\n    </bpmn:laneSet>\n      <bpmn:startEvent id=\"Start_W\" name=\"Worker builds skills on the job\"><bpmn:outgoing>Flow_Start_W_T_Work</bpmn:outgoing></bpmn:startEvent>\n      <bpmn:task id=\"T_Work\" name=\"Do the work.
